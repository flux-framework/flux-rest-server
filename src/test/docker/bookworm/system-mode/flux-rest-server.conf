# Copied from the project's own examples/flux-rest-server-insecure.conf.example.
# Local testing only - plain HTTP + Basic auth, no TLS. See that file for the
# production-oriented alternative (TLS + a real site auth method).

server {
    listen 8080;
    server_name localhost;

    auth_basic "flux (insecure test)";
    auth_basic_user_file /etc/nginx/flux.htpasswd;

    location /api/ {
        if ($remote_user !~ "^[a-z_][a-z0-9_-]*$") { return 403; }

        auth_request /_ensure;
        set $sock /run/flux-rest-server/$remote_user.sock;
        proxy_pass http://unix:$sock:$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /_ensure {
        internal;
        proxy_pass http://unix:/run/flux-rest-server/ensure.sock;
        proxy_method GET;
        proxy_set_header X-Remote-User $remote_user;
    }
}
